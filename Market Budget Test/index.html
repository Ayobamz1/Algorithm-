<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Budget Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Market Budget</h1>
        <p>Plan your shopping and manage your expenses.</p>
      </header>

      <!-- Budget Section -->
      <section class="budget-section">
        <h2>My Budget</h2>

        <div class="budget-input">
          <label for="budget">Enter your budget (₦)</label>

          <input type="number" id="budget" placeholder="e.g. 50000" />

          <button type="button" id="setBudgetBtn" onclick="setBudget()">
            Set Budget
          </button>
        </div>
      </section>

      <!-- Summary Section -->
      <section class="summary">
        <div class="summary-card">
          <h3>Total Budget</h3>
          <p id="totalBudget">₦0</p>
        </div>

        <div class="summary-card">
          <h3>Total Expenses</h3>
          <p id="totalExpenses">₦0</p>
        </div>

        <div class="summary-card">
          <h3>Balance</h3>
          <p id="remainingBalance">₦0</p>
        </div>
        <p id="budgetWarning"></p>
      </section>

      <!-- Add Item Section -->
      <section class="add-section">
        <h2>Add Market Item</h2>

        <div class="form-group">
          <div>
            <label for="itemName">Item Name</label>
            <input type="text" id="itemName" placeholder="e.g. Rice" />
          </div>

          <div>
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" placeholder="e.g. 2" min="1" />
          </div>

          <div>
            <label for="price">Price per Item (₦)</label>
            <input type="number" id="price" placeholder="e.g. 5000" min="0" />
          </div>
        </div>

        <button type="button" id="addItemBtn" onclick="addItem()">
          + Add Item
        </button>
        
        <button onclick="clearAllItems()" id="clearAllItems">Clear All Items</button>
      </section>

      <!-- Shopping List -->
      <section class="list-section">
        <h2>My Shopping List</h2>

        <div class="list-header">
          <span>Item</span>
          <span>Quantity</span>
          <span>Price</span>
          <span>Total</span>
          <span>Action</span>
        </div>

        <div id="shoppingList">
          <p class="empty-message">
            No items added yet. Start adding your market items!
          </p>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
