<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexa Calculator</title>
    <link rel="stylesheet" href="text.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container">
      <div class="calculator">
        <!-- Header -->
        <div class="header">
          <div class="logo">N</div>

          <div class="brand">
            <h2>Nexa</h2>
            <p>SMART CALCULATOR</p>
          </div>

          <button class="theme-button" id="theme">☼</button>
        </div>

        <!-- Calculator Display -->
        <div class="display">
          <div class="display-top">
            <span>DISPLAY</span>
            <span>● READY</span>
          </div>

          <p id="previous-display"></p>

          <h1 id="current-display">0</h1>

          <div class="display-bottom">
            <span>RESULT</span>
            <span>DEC</span>
          </div>
        </div>

        <!-- Calculator Buttons -->
        <div class="buttons">
          <!-- Row 1 -->
          <button class="function" id="clear">AC</button>
          <button class="function" id="delete">DEL</button>
          <button class="function" id="percent">%</button>
          <button class="operator" id="divide" onclick="number('÷')">÷</button>

          <!-- Row 2 -->
          <button class="number" id="seven" onclick="number(7)">7</button>
          <button class="number" id="eight" onclick="number(8)">8</button>
          <button class="number" id="nine" onclick="number(9)">9</button>
          <button class="operator" id="multiply" onclick="number('×')">×</button>

          <!-- Row 3 -->
          <button class="number" id="four" onclick="number(4)">4</button>
          <button class="number" id="five" onclick="number(5)">5</button>
          <button class="number" id="six" onclick="number(6)">6</button>
          <button class="operator" id="subtract" onclick="number('−')">−</button>

          <!-- Row 4 -->
          <button class="number" id="one" onclick="number(1)">1</button>
          <button class="number" id="two" onclick="number(2)">2</button>
          <button class="number" id="three" onclick="number(3)">3</button>
          <button class="operator" id="add" onclick="number('+')">+</button>

          <!-- Row 5 -->
          <button class="number zero" id="zero" onclick="number(0)">0</button>
          <button class="number" id="decimal">.</button>
          <button class="equals" id="equals" onclick="equa()">=</button>
        </div>

        <!-- Footer -->
        <div class="footer">
          <span>Designed with precision</span>
          <span>v1.0.0</span>
        </div>
      </div>

      <p class="copyright">© 2026 Nexa Calculator. All rights reserved.</p>
    </div>

    <script src="text.js"></script>
  </body>
</html>
