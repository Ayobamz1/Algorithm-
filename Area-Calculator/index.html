<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algorithm</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="calculator">
      <h2>Triangle Area</h2>
      <label for="base">Base (m)</label>
      <input type="number" id="base" placeholder="Enter base" />

      <label for="base">Height (m)</label>
      <input type="number" id="height" placeholder="Enter height" />

      <button id="triangleButton">Calculate Area</button>

      <p id="triangleResult">Result will display here.</p>
    </section>

    <section class="calculator">
      <h2>Square Area</h2>
      <label for="side">Side (m)</label>
      <input type="number" id="side" placeholder="Enter side" />

      <button id="squareButton">Calculate Area</button>

      <p id="squareResult">Result will display here.</p>
    </section>

    <section class="calculator">
      <h2>Circle Area</h2>
      <label for="side">Radius (m)</label>
      <input type="number" id="radius" placeholder="Enter radius" />

      <button id="circleButton">Calculate Area</button>

      <p id="circleResult">Result will display here.</p>
    </section>

    <section class="calculator">
      <h2>Quadrilateral Area</h2>
      <label for="side">length (m)</label>
      <input type="number" id="length" placeholder="Enter length" />

       <label for="side">height 1 (m)</label>
      <input type="number" id="height1" placeholder="Enter height 1" />

       <label for="side">height 2 (m)</label>
      <input type="number" id="height2" placeholder="Enter height 2" />

      <button id="quadButton">Calculate Area</button>

      <p id="quadResult">Result will display here.</p>
    </section>

    <script src="script.js"></script>
  </body>
</html>
